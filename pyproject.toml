[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polytool"
version = "0.2.1"
description = "One-binary CLI bundling 26 everyday utilities — image/video/PDF conversion, background removal, OCR, QR codes, hashing, downloads, and more"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "polytool contributors" }]
keywords = [
    "cli", "utility", "image", "video", "pdf", "convert", "background-removal",
    "ocr", "qr", "yt-dlp", "ffmpeg", "swiss-army-knife",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyperclip>=1.8",
    "segno>=1.6",
    "faker>=25",
    "pint>=0.24",
    "python-dateutil>=2.9",
    "xxhash>=3.4",
    "pyjwt>=2.8",
    "ruamel.yaml>=0.18",
    "tomli-w>=1.0",
    "xmltodict>=0.13",
    "python-slugify>=8",
    "markdown-it-py>=3",
    "cron-descriptor>=1.4",
    "croniter>=2",
]

[project.optional-dependencies]
img = [
    "pillow>=10",
    "pillow-heif>=0.18",
    "pillow-avif-plugin>=1.4",
    "resvg-py>=0.1",
    "piexif>=1.1",
    "colorthief>=0.2",
    "ascii-magic>=2",
]
vid = ["ffmpeg-python>=0.2", "imageio-ffmpeg>=0.5"]
pdf = ["pypdf>=4", "pikepdf>=8", "pdfplumber>=0.11", "pymupdf>=1.24"]
dl = ["yt-dlp>=2024.5"]
ocr = ["pytesseract>=0.3", "easyocr>=1.7"]
ai = ["rembg[cpu]>=2.0"]
qr-decode = ["pyzbar>=0.1"]
shot = ["mss>=9", "playwright>=1.44"]
archive = ["py7zr>=0.21"]
full = [
    "polytool[img,vid,pdf,dl,ocr,ai,qr-decode,shot,archive]",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "basedpyright>=1.13",
    "pre-commit>=3.7",
]

[project.scripts]
polytool = "polytool.cli:run"
pt = "polytool.cli:run"

[project.urls]
Homepage = "https://github.com/k6w/polytool"
Repository = "https://github.com/k6w/polytool"
Issues = "https://github.com/k6w/polytool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polytool"]

[tool.hatch.build.targets.sdist]
include = ["src/polytool", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PL",            # pylint subset
    "PTH",           # use pathlib
    "TID",           # tidy imports
]
ignore = [
    "E501",          # line too long (handled by formatter)
    "PLR0913",       # too many arguments (Typer commands often have many)
    "PLR2004",       # magic value comparisons (fine in tests / cli)
    "B008",          # function calls in default args (Typer's pattern)
    "PLR0911",       # too many returns (fine for CLI dispatchers)
    "PLR0912",       # too many branches
    "PLC0415",       # imports inside functions (intentional — lazy-load heavy deps)
    "PLR0915",       # too many statements (CLI subcommands often need many)
    "TID252",        # relative imports (we use absolute, but fixture imports differ)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportAny = false
reportExplicitAny = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that need network access",
]
