name: Release

# Push a tag like `v0.2.0` and this workflow will:
#   1. Build wheel + sdist with uv
#   2. Publish to PyPI (uses repo secret PYPI_API_TOKEN; idempotent via skip-existing)
#   3. Create a GitHub Release with auto-generated notes and the built artifacts
#
# How to set up (one-time):
#   - Add a project-scoped PyPI token as repo secret PYPI_API_TOKEN
#       gh secret set PYPI_API_TOKEN --body 'pypi-...'
#   - Or migrate to PyPI Trusted Publishing later:
#       https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for creating GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
